name: sonarar
description: "Sonarar — a personal music player that already knows what you want."
publish_to: 'none'
version: 0.3.3+33

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  path_provider: ^2.1.4
  audio_session: ^0.1.21
  just_audio: ^0.9.42
  # Pinned exactly at what 0.3.2 ships: a caret on a beta let this range pick
  # beta.15 while the released build carried beta.17.
  just_audio_background: 0.0.1-beta.17

  http: ^1.2.0
  open_filex: ^4.6.0
  crypto: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  wakelock_plus: ^1.8.0

  korean_romanization_converter: ^0.0.1
  youtube_explode_dart: ^3.1.0
  # Pinned exactly, same reason: 0.1.x is three APIs in one week.
  ytdlp_flutter: 0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/library/
    - assets/config/
    - assets/brand/
    - assets/legal/
    - assets/themes/

# Vendored to make the ffmpeg payload optional: the published plugin calls
# FFmpeg.init unguarded, which turns "we do not ship 36 MB we never use" into
# "init fails and downloads never work".
dependency_overrides:
  ytdlp_flutter:
    path: ../vendor/ytdlp_flutter
