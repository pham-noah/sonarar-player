Categories:
  - Multimedia
License: GPL-3.0-or-later
SourceCode: https://github.com/pham-noah/sonarar-player
IssueTracker: https://github.com/pham-noah/sonarar-player/issues

RepoType: git
Repo: https://github.com/pham-noah/sonarar-player.git

Builds:
  - versionName: 0.2.0
    versionCode: 20
    commit: v0.2.0
  - versionName: 0.1.3
    versionCode: 14
    commit: v0.1.3
  - versionName: 0.1.2
    versionCode: 13
    commit: v0.1.2
    subdir: app_src
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f 3.47.6
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
    build:
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm64
    output: build/app/outputs/flutter-apk/app-release.apk
    scanignore:
      - app_src/.flutter/bin/cache
      - lib/**/libpython.zip.so
      - lib/**/libffmpeg.zip.so
    scandelete:
      - app_src/.flutter
      - app_src/.pub-cache

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.3
CurrentVersionCode: 20
